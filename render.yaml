# Render Blueprint — free tier only (single web service, no Postgres/Redis)
#
# Deploy from repo root. Root start.sh / render-build.sh wrappers call backend/.
# Works whether Render Root Directory is blank or still set to backend/.
services:
  - type: web
    name: rate-limiter
    runtime: python
    plan: free
    branch: deploy
    autoDeployTrigger: commit
    buildCommand: bash render-build.sh
    startCommand: bash start.sh
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - render.yaml
        - start.sh
        - render-build.sh
      ignoredPaths:
        - docs/**
        - "**/*.pdf"
        - README.md
        - .env.example
        - .gitignore
        - frontend/coverage/**
        - frontend/dist/**
    domains:
      - ratelimiter.kaustuvbasak.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENV
        value: production
      - key: STORAGE_MODE
        value: session
