# Render Blueprint — free tier only (single web service, no Postgres/Redis)
#
# Autodeploy: any change under backend/, frontend/, or deploy config triggers a rebuild.
# rootDir is `backend` for Python build/start commands only — without buildFilter,
# Render ignores commits that touch only frontend/ or render.yaml (monorepo behavior).
services:
  - type: web
    name: rate-limiter
    runtime: python
    plan: free
    branch: deploy
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: bash render-build.sh
    startCommand: bash start.sh
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - render.yaml
      ignoredPaths:
        - docs/**
        - "**/*.pdf"
        - README.md
        - .env.example
        - .gitignore
        - frontend/coverage/**
        - frontend/dist/**
    domains:
      - ratelimiter.kaustuvbasak.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENV
        value: production
      - key: STORAGE_MODE
        value: session
