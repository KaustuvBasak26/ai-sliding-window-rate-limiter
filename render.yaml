# Render Blueprint — free tier only (single web service, no Postgres/Redis)
#
# Autodeploy: pushes to `deploy` branch rebuild when backend OR frontend changes.
# rootDir is `backend` for Python commands; buildFilter adds frontend/** because
# Render ignores file changes outside rootDir by default (monorepo behavior).
services:
  - type: web
    name: rate-limiter
    runtime: python
    plan: free
    branch: deploy
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: bash render-build.sh
    startCommand: bash start.sh
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - frontend/**
    domains:
      - rate-limiter.kaustuvbasak.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENV
        value: production
      - key: STORAGE_MODE
        value: session
