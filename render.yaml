# Render Blueprint — free tier only (single web service, no Postgres/Redis)
services:
  - type: web
    name: rate-limiter
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && cd ../frontend && npm ci && npm run build
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENV
        value: production
      - key: STORAGE_MODE
        value: session
