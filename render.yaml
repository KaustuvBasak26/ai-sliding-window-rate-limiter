# Render Blueprint — free tier only (single web service, no Postgres/Redis)
#
# Repo root deploy: backend + frontend are built together on each push to `deploy`.
# buildFilter limits autodeploy to app code (not docs/PDFs).
services:
  - type: web
    name: rate-limiter
    runtime: python
    plan: free
    branch: deploy
    autoDeployTrigger: commit
    buildCommand: bash backend/render-build.sh
    startCommand: bash backend/start.sh
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - render.yaml
      ignoredPaths:
        - docs/**
        - "**/*.pdf"
        - README.md
        - .env.example
        - .gitignore
        - frontend/coverage/**
        - frontend/dist/**
    domains:
      - ratelimiter.kaustuvbasak.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENV
        value: production
      - key: STORAGE_MODE
        value: session
